services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telmax}
      POSTGRES_USER: ${POSTGRES_USER:-telmax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - telmax_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telmax} -d ${POSTGRES_DB:-telmax}"]
      interval: 10s
      timeout: 5s
      retries: 10

  telmax:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://telmax.uz}
    image: telmax-app:latest
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-telmax}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-telmax}
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:3020:3000"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  telmax_postgres_data:
