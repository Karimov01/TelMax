services:
  telmax:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://telmax.uz}
    image: telmax-app:latest
    restart: unless-stopped
    env_file: [.env.production]
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [telmax]
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      telmax:
        condition: service_healthy
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      TELMAX_DOMAIN: ${TELMAX_DOMAIN:-telmax.uz}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [telmax]
networks:
  telmax:
volumes:
  caddy_data:
  caddy_config:
